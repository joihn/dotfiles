approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_verbosity = "low"
model_context_window = 1000000
model_reasoning_effort = "xhigh"
service_tier = "default"
personality = "pragmatic"
developer_instructions = """
# Communication style

- Be brief. Use short sentences, simple words, and direct answers. Skip low-level details unless asked.
- Match structure to length: use plain prose for short answers; use `#`, `##`, and `###` headings plus bullets when covering multiple topics.
- Present information hierarchically when that improves clarity. Nest bullets when useful.
- Use compact tables or ASCII diagrams when a visual representation makes relationships easier to understand.
- Do not add preambles, filler, or flattery.
"""

[tui]
alternate_screen = "always"
vim_mode_default = false
status_line = [
    "current-dir",
    "model-with-reasoning",
    "context-used",
    "used-tokens",
    "five-hour-limit",
    "weekly-limit",
]

[tui.keymap.chat]
interrupt_turn = []


[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[notice]
hide_full_access_warning = true

[plugins."slack@openai-curated"]
enabled = true

[features]
hooks = true
