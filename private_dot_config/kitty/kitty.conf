#include ./theme.conf


# BEGIN_KITTY_THEME
# Broadcast
include current-theme.conf
# END_KITTY_THEME
enable_audio_bell no
font_family      Monospace
font_size        11.0

enabled_layouts tall:bias=56, stack

# Kitty panel controls: press Cmd+A first, then the full shortcut.
# Unprefixed shortcuts pass through to Herdr.
map cmd+a>ctrl+tab next_window
map cmd+a>ctrl+shift+tab previous_window
map cmd+a>ctrl+shift+x toggle_layout stack
map cmd+a>ctrl+shift+n new_window_with_cwd
map cmd+a>ctrl+shift+h show_scrollback
map cmd+a>ctrl+shift+z move_window left
map cmd+a>ctrl+shift+w close_window

# Remove kitty's built-in actions for the direct Herdr pane shortcuts.
map ctrl+tab
map ctrl+shift+tab
map ctrl+shift+x
# Override kitty's built-in new-OS-window shortcut and forward the distinct
# CSI-u encoding so Herdr receives Ctrl+Shift+N directly.
map ctrl+shift+n send_text all \x1b[110;6u
map ctrl+shift+h
map ctrl+shift+z
map ctrl+shift+w

# Disable kitty's built-in new-window action for this chord completely.
map ctrl+shift+enter discard_event

startup_session ~/.config/kitty/startup_session 


map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# Make Shift+Enter insert a newline in apps like Claude Code, even inside tmux.
# Sends ESC+CR (== Alt/Option+Enter), which passes through tmux cleanly instead
# of relying on the kitty keyboard protocol (which tmux does not forward).
map shift+enter send_text all \x1b\r

# Herdr prefix: emit the kitty-keyboard-protocol encoding for super+d
# (CSI 100 ; 9 u) so Herdr receives cmd+d even without protocol negotiation.
# Herdr's prefix is set to "cmd+d" in ~/.config/herdr/config.toml.
map cmd+d send_text all \x1b[100;9u

map ctrl+shift+r clear_terminal reset active
cursor_trail 400
# Let Neovim use Kitty's clipboard provider in both directions, including over SSH.
# This permits programs in the terminal to read the host clipboard without a prompt.
clipboard_control write-clipboard write-primary read-clipboard read-primary-ask
#scrollback_pager nvim -u NONE -R -M -c 'lua require("kitty+page")(INPUT_LINE_NUMBER)' -
#scrollback_pager less -I --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER 




scrollback_pager $HOME/.config/kitty/nvim-pager.sh INPUT_LINE_NUMBER




text_fg_override_threshold 2

# macos_option_as_meta yes # old ?
macos_option_as_alt yes

copy_on_select a1
mouse_map middle release ungrabbed paste_from_buffer a1


scrollback_lines 99999
