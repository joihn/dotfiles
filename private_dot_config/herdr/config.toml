onboarding = false
# Herdr configuration
# Docs: https://herdr.dev  |  print defaults with `herdr --default-config`

[keys]
# Prefix key to enter prefix mode. Default is "ctrl+b".
# The Command key can't travel over legacy terminal input, so kitty is
# configured (map cmd+d -> \x1b[100;9u in ~/.config/kitty/kitty.conf) to emit
# the kitty-keyboard-protocol encoding for super+d, which Herdr decodes here.
prefix = "cmd+d"

# Direct pane controls. All other Herdr actions keep their usual prefix bindings.
cycle_pane_next = "ctrl+tab"
cycle_pane_previous = "ctrl+shift+tab"
zoom = "ctrl+shift+x"
# Native horizontal split (stacked top and bottom).
split_horizontal = "ctrl+shift+n"
copy_mode = "ctrl+shift+h"
swap_pane_left = "ctrl+shift+z"
close_pane = "ctrl+shift+w"

[ui]
# Keep split panes visually separated instead of sharing divider borders.
# false = compact shared divider (much less separation between panes).
pane_gaps = false

agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$task", bold = true, dim = false }],
  ["workspace", "tab"],
]

[ui.toast]
# "system" = native macOS notification (osascript), fires when an agent
# finishes or needs input.
delivery = "system"

# Keep mouse selections copying automatically, but suppress the confirmation.
[ui.toast.clipboard]
enabled = false

[theme]
name = "dracula"
auto_switch = false
